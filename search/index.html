<script src="https://cdn.staticfile.net/algoliasearch/4.14.2/algoliasearch-lite.umd.js"></script>
<script>
    // 配置 Algolia (已填入安全密钥)
    const client = algoliasearch('5KQI8J7ZCC', '530ac637a93bbe69d377d96b90c598ba');
    const index = client.initIndex('astra_blog');

    const searchInput = document.getElementById('algolia-search-input');
    const searchResult = document.getElementById('algolia-search-result');

    searchInput.addEventListener('input', function() {
        const query = this.value.trim();
        if (query.length === 0) {
            searchResult.innerHTML = '';
            return;
        }

        index.search(query, { hitsPerPage: 10 }).then(({ hits }) => {
            if (hits.length === 0) {
                searchResult.innerHTML = '<p style="color: rgba(215,236,255,0.4); text-align: center;">宇宙深处没有找到相关代码...</p>';
                return;
            }
            
            let html = '<ul class="search-result-list">';
            hits.forEach(hit => {
                let title = hit._highlightResult.title ? hit._highlightResult.title.value : hit.title;
                let contentExcerpt = hit._highlightResult.content ? hit._highlightResult.content.value : hit.content;
                html += `
                    <li>
                        <a href="/${hit.path}" class="search-result-title">${title}</a>
                        <p class="search-result-snippet">${contentExcerpt.substring(0, 100)}...</p>
                    </li>
                `;
            });
            html += '</ul>';
            searchResult.innerHTML = html;
        }).catch(err => {
            console.error(err);
            searchResult.innerHTML = '<p style="color: red;">Algolia检索中枢网络连接断开 (请检查密钥)。</p>';
        });
    });
</script>
